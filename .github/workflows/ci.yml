name: Offline checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check browser script syntax
        run: |
          node --check docs/app.js
          node --check docs/reciprocal.js
          node --check docs/data.js
          node --check docs/data-v2.js
          node --check docs/conflict.js
          node --check docs/data-v3.js
          node --check docs/directive.js
          node --check docs/data-v4.js
          node --check docs/objection.js
          if [ -f docs/data-v5.js ]; then node --check docs/data-v5.js; fi
          if [ -f docs/conversation.js ]; then node --check docs/conversation.js; fi
          if [ -f docs/data-v6.js ]; then node --check docs/data-v6.js; fi
      - name: Exercise deterministic benchmarks
        run: |
          python benchmark/pilot.py --dry-run
          python -m benchmark.reciprocal.runner --dry-run
          python -m benchmark.conflict.runner --dry-run
          python -m benchmark.directive.runner --dry-run
          python -m benchmark.objection.runner --dry-run
          python -m benchmark.conversation.runner --dry-run
